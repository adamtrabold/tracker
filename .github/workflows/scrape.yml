name: Scrape prices

on:
  schedule:
    # Every 6 hours (UTC). Adjust as you like.
    - cron: "0 */6 * * *"
  workflow_dispatch: {}   # lets you run it on demand from the Actions tab

permissions:
  contents: write         # needed to commit updated data/ back to the repo

concurrency:
  group: scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r scraper/requirements.txt

      - name: Install Chromium for Playwright
        run: python -m playwright install --with-deps chromium

      - name: Run scraper
        env:
          # Add these as repo secrets (Settings → Secrets and variables → Actions).
          # With SCRAPER_API_KEY set, requests route through the scraping API and
          # get past retailer anti-bot blocks. Without it, direct fetch is used.
          SCRAPER_API_KEY: ${{ secrets.SCRAPER_API_KEY }}
          SCRAPER_API_PROVIDER: ${{ vars.SCRAPER_API_PROVIDER }}
          # Optional repo variable: "premium" or "ultra" to use tougher proxies
          # for big-box retailers (costs more API credits). Empty = standard.
          SCRAPER_API_PREMIUM: ${{ vars.SCRAPER_API_PREMIUM }}
        run: python scraper/scrape.py

      - name: Commit updated data
        run: |
          git config user.name "price-tracker-bot"
          git config user.email "actions@github.com"
          git add data/latest.json data/history.json
          if git diff --staged --quiet; then
            echo "No price changes."
          else
            git commit -m "Update prices ($(date -u +'%Y-%m-%d %H:%M UTC'))"
            git push
          fi
