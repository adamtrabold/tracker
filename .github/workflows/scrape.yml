name: Scrape prices

on:
  schedule:
    # Every 6 hours (UTC). Adjust as you like.
    - cron: "0 */6 * * *"
  workflow_dispatch: {}   # lets you run it on demand from the Actions tab

permissions:
  contents: write         # needed to commit updated data/ back to the repo

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r scraper/requirements.txt

      - name: Install Chromium for Playwright
        run: python -m playwright install --with-deps chromium

      - name: Run scraper
        env:
          # Add these as repo secrets (Settings → Secrets and variables → Actions).
          # SERPAPI_KEY: covers the big-box majors via one Google Shopping query.
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
          # BESTBUY_API_KEY: official free Best Buy Products API.
          BESTBUY_API_KEY: ${{ secrets.BESTBUY_API_KEY }}
          # Optional: route "direct" retailers through a scraping API too.
          SCRAPER_API_KEY: ${{ secrets.SCRAPER_API_KEY }}
          SCRAPER_API_PROVIDER: ${{ vars.SCRAPER_API_PROVIDER }}
          SCRAPER_API_PREMIUM: ${{ vars.SCRAPER_API_PREMIUM }}
        run: python scraper/scrape.py

      - name: Commit updated data
        run: |
          git config user.name "price-tracker-bot"
          git config user.email "actions@github.com"
          git add data/latest.json data/history.json
          if git diff --staged --quiet; then
            echo "No price changes."
          else
            git commit -m "Update prices ($(date -u +'%Y-%m-%d %H:%M UTC'))"
            git push
          fi
